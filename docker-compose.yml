services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - dashboard

  nginx:
    image: nginx:alpine
    container_name: dashboard_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dashboard

  mysql:
    image: mysql:8.4
    container_name: dashboard_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dashboard
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: dashboard_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - dashboard_mysql_data:/var/lib/mysql
    networks:
      - dashboard
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dashboard_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: dashboard
      PMA_PASSWORD: dashboard_password
    depends_on:
      - mysql
    networks:
      - dashboard
networks:
  dashboard:

volumes:
  dashboard_mysql_data: